[package]
name = "alertapp-tools"
version = "0.1.0"
edition = "2024"
description = "AlertApp 桌面端与命令行工具"

default-run = "alertapp-desktop"

# 桌面端 GUI
[[bin]]
name = "alertapp-desktop"
path = "src/main.rs"

# 命令行发布工具：alertapp-send --broker xx --topic yy --title zz --body ww
[[bin]]
name = "alertapp-send"
path = "src/bin/send.rs"

[dependencies]
alertapp = { path = "../app" }
anyhow = "1"
serde_json = "1"
# 与 alertapp 保持同一 rumqttc 版本/特性（send 工具直接复用 build_options）
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
